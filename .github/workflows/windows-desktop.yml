name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'desktop-ui.js', 'app.js', 'index.html', 'style.css', 'package.json', '.github/workflows/windows-desktop.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: BattleLayer-Windows
          path: dist/*.exe
